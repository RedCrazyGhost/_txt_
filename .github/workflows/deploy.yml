name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Lighthouse quality gate
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          sleep 12
          curl -sf http://127.0.0.1:4173/ > /dev/null || true
          curl -sf http://127.0.0.1:4173/fonts.css > /dev/null || true
          sleep 3
          LIGHTHOUSE_URL=http://127.0.0.1:4173/ \
          LH_THRESHOLD_PERFORMANCE=70 \
          LH_THRESHOLD_SEO=85 \
          LH_THRESHOLD_BEST_PRACTICES=85 \
          LH_MAX_ATTEMPTS=3 \
          npm run lighthouse
          kill $PREVIEW_PID

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
